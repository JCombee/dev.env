<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <div class="row">
      <div class="swatch">
        <div class="chip-lg" style="background: var(--color-ink); border-color: var(--color-ink);"></div>
        <div class="val">Ink</div>
        <div class="lbl">#0E1116</div>
      </div>
      <div class="swatch">
        <div class="chip-lg" style="background: var(--color-paper); border-color: var(--border-2);"></div>
        <div class="val">Paper</div>
        <div class="lbl">#F7F6F2</div>
      </div>
      <div class="swatch">
        <div class="chip-lg" style="background: var(--color-lime); border-color: var(--color-lime);"></div>
        <div class="val">Lime</div>
        <div class="lbl">#C6F432</div>
      </div>
      <div class="swatch">
        <div class="chip-lg" style="background: var(--color-lime-deep); border-color: var(--color-lime-deep);"></div>
        <div class="val">Lime Deep</div>
        <div class="lbl">#A8D11A</div>
      </div>
      <div class="swatch">
        <div class="chip-lg" style="background: var(--color-lime-soft); border-color: var(--color-lime-soft);"></div>
        <div class="val">Lime Soft</div>
        <div class="lbl">#E6F9A3</div>
      </div>
    </div>
  </div></body></html>

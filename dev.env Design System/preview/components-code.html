<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <pre style="margin:0; padding: 16px; background: var(--bg-3); border: 1px solid var(--border-1); border-radius: 6px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; color: var(--fg-1); max-width: 600px;"><span style="color: var(--fg-3);"># .dev.env.yaml</span>
<span style="color: var(--color-info);">project</span>: my-project
<span style="color: var(--color-info);">services</span>:
  - <span style="color: var(--color-info);">image</span>: mysql
    <span style="color: var(--color-info);">tag</span>: <span style="color: var(--color-success);">"8.0"</span>
  - redis
  - <span style="color: var(--color-info);">image</span>: elasticsearch
    <span style="color: var(--color-info);">dedicated</span>: <span style="color: var(--color-warning);">true</span></pre>
  </div></body></html>

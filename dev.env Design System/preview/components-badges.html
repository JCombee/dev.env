<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <div class="row" style="gap: 10px; align-items: center;">
      <span style="font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 999px; background: var(--color-lime-soft); color: var(--stone-800); border: 1px solid var(--color-lime-deep);">shared</span>
      <span style="font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 999px; background: var(--bg-1); color: var(--fg-1); border: 1px dashed var(--color-warning);">dedicated</span>
      <span style="font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 999px; background: rgba(229,72,77,0.10); color: var(--color-error); border: 1px solid rgba(229,72,77,0.30);">deprecated</span>
      <span style="font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 999px; background: var(--bg-3); color: var(--fg-2); border: 1px solid var(--border-1);">v0.6.5</span>
      <span style="font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 999px; background: var(--color-ink); color: var(--color-paper); border: 1px solid var(--color-ink);">new</span>
    </div>
    <div class="lbl">capsule badges · mono · 12 / 500</div>
  </div></body></html>

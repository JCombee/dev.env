<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <div class="row">
      
      <div class="swatch" style="gap:6px;">
        <div style="width: 88px; height: 56px; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 4px;"></div>
        <div class="val">4px</div>
        <div class="lbl">default</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 88px; height: 56px; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 6px;"></div>
        <div class="val">6px</div>
        <div class="lbl">buttons / cards</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 88px; height: 56px; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 8px;"></div>
        <div class="val">8px</div>
        <div class="lbl">large surfaces</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 88px; height: 56px; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 28px;"></div>
        <div class="val">999px</div>
        <div class="lbl">capsule badges</div>
      </div>
    </div>
  </div></body></html>

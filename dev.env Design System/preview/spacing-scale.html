<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <div class="row" style="gap: 8px; align-items: flex-end;">
      
      <div class="swatch" style="gap:6px;">
        <div style="width: 4px; height: 4px; background: var(--color-ink);"></div>
        <div class="lbl">4</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 8px; height: 8px; background: var(--color-ink);"></div>
        <div class="lbl">8</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 12px; height: 12px; background: var(--color-ink);"></div>
        <div class="lbl">12</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 16px; height: 16px; background: var(--color-ink);"></div>
        <div class="lbl">16</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 24px; height: 24px; background: var(--color-ink);"></div>
        <div class="lbl">24</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 32px; height: 32px; background: var(--color-ink);"></div>
        <div class="lbl">32</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 48px; height: 48px; background: var(--color-ink);"></div>
        <div class="lbl">48</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 64px; height: 64px; background: var(--color-ink);"></div>
        <div class="lbl">64</div>
      </div>
      <div class="swatch" style="gap:6px;">
        <div style="width: 96px; height: 96px; background: var(--color-ink);"></div>
        <div class="lbl">96</div>
      </div>
    </div>
    <div class="lbl">8-pt grid · 4 for fine adjustments</div>
  </div></body></html>

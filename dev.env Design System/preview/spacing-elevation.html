<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <div class="row" style="gap: 24px; padding: 12px 0;">
      <div class="swatch" style="gap:8px; align-items:center;">
        <div style="width: 96px; height: 64px; background: var(--bg-1); border: 1px solid var(--border-2); border-radius: 6px;"></div>
        <div class="val">elevation-0</div>
        <div class="lbl">default · flat</div>
      </div>
      <div class="swatch" style="gap:8px; align-items:center;">
        <div style="width: 96px; height: 64px; background: var(--bg-1); border-radius: 6px; box-shadow: var(--elevation-1);"></div>
        <div class="val">elevation-1</div>
        <div class="lbl">popovers</div>
      </div>
      <div class="swatch" style="gap:8px; align-items:center;">
        <div style="width: 96px; height: 64px; background: var(--bg-1); border-radius: 6px; box-shadow: var(--elevation-2);"></div>
        <div class="val">elevation-2</div>
        <div class="lbl">hero / modal</div>
      </div>
    </div>
  </div></body></html>

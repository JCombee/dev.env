<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <div class="row" style="gap: 0;">
      
      <div class="swatch" style="gap:4px;">
        <div style="width: 64px; height: 56px; background: var(--stone-50); border-right: 1px solid var(--border-1);"></div>
        <div class="lbl" style="padding-left: 4px;">50</div>
      </div>
      <div class="swatch" style="gap:4px;">
        <div style="width: 64px; height: 56px; background: var(--stone-100); border-right: 1px solid var(--border-1);"></div>
        <div class="lbl" style="padding-left: 4px;">100</div>
      </div>
      <div class="swatch" style="gap:4px;">
        <div style="width: 64px; height: 56px; background: var(--stone-200); border-right: 1px solid var(--border-1);"></div>
        <div class="lbl" style="padding-left: 4px;">200</div>
      </div>
      <div class="swatch" style="gap:4px;">
        <div style="width: 64px; height: 56px; background: var(--stone-300); border-right: 1px solid var(--border-1);"></div>
        <div class="lbl" style="padding-left: 4px;">300</div>
      </div>
      <div class="swatch" style="gap:4px;">
        <div style="width: 64px; height: 56px; background: var(--stone-400); border-right: 1px solid var(--border-1);"></div>
        <div class="lbl" style="padding-left: 4px;">400</div>
      </div>
      <div class="swatch" style="gap:4px;">
        <div style="width: 64px; height: 56px; background: var(--stone-500); border-right: 1px solid var(--border-1);"></div>
        <div class="lbl" style="padding-left: 4px;">500</div>
      </div>
      <div class="swatch" style="gap:4px;">
        <div style="width: 64px; height: 56px; background: var(--stone-600); border-right: 1px solid var(--border-1);"></div>
        <div class="lbl" style="padding-left: 4px;">600</div>
      </div>
      <div class="swatch" style="gap:4px;">
        <div style="width: 64px; height: 56px; background: var(--stone-700); border-right: 1px solid var(--border-1);"></div>
        <div class="lbl" style="padding-left: 4px;">700</div>
      </div>
      <div class="swatch" style="gap:4px;">
        <div style="width: 64px; height: 56px; background: var(--stone-800); border-right: 1px solid var(--border-1);"></div>
        <div class="lbl" style="padding-left: 4px;">800</div>
      </div>
      <div class="swatch" style="gap:4px;">
        <div style="width: 64px; height: 56px; background: var(--stone-900); border-right: 1px solid var(--border-1);"></div>
        <div class="lbl" style="padding-left: 4px;">900</div>
      </div>
    </div>
  </div></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <div class="row" style="gap: 12px;">
      <div style="flex: 1; min-width: 220px; padding: 12px 14px; border-left: 3px solid var(--color-success); background: var(--bg-2); border-radius: 0 4px 4px 0;">
        <div style="font-family: var(--font-mono); font-size: 11px; color: var(--color-success); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;">DO</div>
        <div style="font-family: var(--font-mono); font-size: 14px; color: var(--fg-1);">dev.env</div>
        <div style="font-family: var(--font-mono); font-size: 14px; color: var(--fg-1);"><code style="background: none; padding:0; border:0;">dev start</code></div>
      </div>
      <div style="flex: 1; min-width: 220px; padding: 12px 14px; border-left: 3px solid var(--color-error); background: var(--bg-2); border-radius: 0 4px 4px 0;">
        <div style="font-family: var(--font-mono); font-size: 11px; color: var(--color-error); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;">DON'T</div>
        <div style="font-family: var(--font-mono); font-size: 14px; color: var(--fg-1); text-decoration: line-through;">Dev.env / dev-env / devenv</div>
        <div style="font-family: var(--font-mono); font-size: 14px; color: var(--fg-1); text-decoration: line-through;">DevEnv 🚀</div>
      </div>
    </div>
  </div></body></html>

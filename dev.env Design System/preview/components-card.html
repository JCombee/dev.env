<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <div style="border: 1px solid var(--border-2); border-radius: 6px; padding: 20px; background: var(--bg-1); max-width: 480px;">
      <div class="eyebrow" style="margin: 0 0 6px;">/ service</div>
      <div style="font-family: var(--font-sans); font-weight: 600; font-size: 22px; color: var(--fg-1); margin-bottom: 6px;">Elasticsearch</div>
      <div style="font-family: var(--font-sans); font-size: 14px; color: var(--fg-2); line-height: 1.55;">Separate index per project. Auto-provisioned on first <code>dev start</code>.</div>
      <div style="display:flex; gap:8px; margin-top: 14px;">
        <span style="font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--color-lime-soft); border: 1px solid var(--color-lime-deep); color: var(--stone-800);">shared</span>
        <span style="font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg-3); border: 1px solid var(--border-1); color: var(--fg-2);">9281</span>
      </div>
    </div>
  </div></body></html>

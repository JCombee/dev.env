<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <div class="row" style="gap: 12px; align-items: center;">
      <button style="font-family: var(--font-mono); font-weight: 500; font-size: 14px; color: var(--color-paper); background: var(--color-ink); border: 1px solid var(--color-ink); border-radius: 6px; padding: 10px 16px; cursor: pointer; letter-spacing: -0.005em;">dev start <span style="color: var(--color-lime); margin-left:4px;">→</span></button>
      <button style="font-family: var(--font-mono); font-weight: 500; font-size: 14px; color: var(--fg-1); background: var(--bg-1); border: 1px solid var(--border-2); border-radius: 6px; padding: 10px 16px; cursor: pointer;">View on GitHub</button>
      <button style="font-family: var(--font-mono); font-weight: 500; font-size: 14px; color: var(--fg-2); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 10px 12px; cursor: pointer;">Skip</button>
      <button disabled style="font-family: var(--font-mono); font-weight: 500; font-size: 14px; color: var(--fg-mute); background: var(--bg-2); border: 1px solid var(--border-1); border-radius: 6px; padding: 10px 16px; cursor: not-allowed;">Disabled</button>
    </div>
    <div class="lbl">primary · secondary · ghost · disabled</div>
  </div></body></html>

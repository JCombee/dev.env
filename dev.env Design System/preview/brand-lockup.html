<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; font-family: var(--font-sans); }
  .card { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .row { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

  /* Inline lockup — uses the page's loaded IBM Plex Mono */
  .wm {
    display: inline-flex; align-items: baseline; gap: 0;
    font-family: var(--font-mono);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg-1);
    line-height: 1;
  }
  .wm .dot {
    display: inline-block;
    background: var(--color-lime);
    margin: 0 0.04em 0.05em;
    transform: translateY(0);
  }

  .lockup { display: inline-flex; align-items: center; gap: 18px; }
  .lockup svg { flex-shrink: 0; }
</style>
</head>
<body>
  <div class="card">
    <!-- Big lockup: logomark + wordmark, all live HTML/CSS so the font is guaranteed -->
    <div class="lockup">
      <svg width="56" height="56" viewBox="0 0 64 64" aria-label="dev.env logomark">
        <rect x="8" y="10" width="48" height="10" rx="2" fill="none" stroke="var(--fg-1)" stroke-width="2"/>
        <rect x="8" y="22" width="48" height="10" rx="2" fill="#C6F432" stroke="#0E1116" stroke-width="2"/>
        <rect x="8" y="34" width="48" height="10" rx="2" fill="none" stroke="var(--fg-1)" stroke-width="2"/>
        <rect x="8" y="46" width="48" height="10" rx="2" fill="none" stroke="var(--fg-1)" stroke-width="2"/>
        <circle cx="50" cy="15" r="1.5" fill="var(--fg-1)"/>
        <circle cx="50" cy="27" r="1.5" fill="var(--fg-1)"/>
        <circle cx="50" cy="39" r="1.5" fill="var(--fg-1)"/>
        <circle cx="50" cy="51" r="1.5" fill="var(--fg-1)"/>
      </svg>
      <span class="wm" style="font-size: 48px;">
        <span>dev</span><span class="dot" style="width: 12px; height: 12px;"></span><span>env</span>
      </span>
    </div>

    <div class="row" style="margin-top: 8px;">
      <div class="swatch">
        <span class="wm" style="font-size: 28px;">
          <span>dev</span><span class="dot" style="width: 7px; height: 7px;"></span><span>env</span>
        </span>
        <span class="lbl">Wordmark</span>
      </div>
      <div class="swatch">
        <svg width="36" height="36" viewBox="0 0 64 64" aria-label="logomark only">
          <rect x="8" y="10" width="48" height="10" rx="2" fill="none" stroke="var(--fg-1)" stroke-width="2"/>
          <rect x="8" y="22" width="48" height="10" rx="2" fill="#C6F432" stroke="#0E1116" stroke-width="2"/>
          <rect x="8" y="34" width="48" height="10" rx="2" fill="none" stroke="var(--fg-1)" stroke-width="2"/>
          <rect x="8" y="46" width="48" height="10" rx="2" fill="none" stroke="var(--fg-1)" stroke-width="2"/>
          <circle cx="50" cy="15" r="1.5" fill="var(--fg-1)"/>
          <circle cx="50" cy="27" r="1.5" fill="var(--fg-1)"/>
          <circle cx="50" cy="39" r="1.5" fill="var(--fg-1)"/>
          <circle cx="50" cy="51" r="1.5" fill="var(--fg-1)"/>
        </svg>
        <span class="lbl">Logomark</span>
      </div>
    </div>
  </div>
</body>
</html>

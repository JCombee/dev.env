<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; padding: 0; background: var(--bg-1); }
  body { padding: 24px; }
  .card { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .swatch { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .chip { width: 64px; height: 64px; border-radius: 4px; border: 1px solid var(--border-1); }
  .chip-lg { width: 96px; height: 64px; border-radius: 6px; border: 1px solid var(--border-1); }
  .chip-sm { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border-1); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-1); }
  .grid { display: grid; gap: 12px; }
</style>
</head>
<body>

  <div class="card">
    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 360px;">
      <label style="font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-3);">project</label>
      <input value="my-project" style="font-family: var(--font-mono); font-size: 14px; color: var(--fg-1); background: var(--bg-1); border: 1px solid var(--border-2); border-radius: 6px; padding: 10px 12px; outline: none;"/>
      <div style="font-family: var(--font-sans); font-size: 13px; color: var(--fg-3);">Used as the database name, Redis key prefix, etc.</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 360px; margin-top: 4px;">
      <label style="font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-error);">project</label>
      <input value="" placeholder="cannot be empty" style="font-family: var(--font-mono); font-size: 14px; color: var(--fg-1); background: var(--bg-1); border: 1px solid var(--color-error); border-radius: 6px; padding: 10px 12px; outline: none;"/>
    </div>
  </div></body></html>

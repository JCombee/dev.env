<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>dev.env — shared dev services. one binary.</title>
  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <link rel="stylesheet" href="styles.css"/>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Terminal.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="FeatureGrid.jsx"></script>
  <script type="text/babel" src="InstallBlock.jsx"></script>
  <script type="text/babel" src="ServiceTable.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <>
          <Header page="home"/>
          <main>
            <Hero/>
            <FeatureGrid/>
            <InstallBlock/>
            <div id="services"><ServiceTable/></div>
            <section style={{ borderTop: '1px solid var(--border-1)', paddingTop: 80, paddingBottom: 80, textAlign: 'center', background: 'var(--bg-2)' }}>
              <div className="container">
                <Eyebrow>/ end — get it running</Eyebrow>
                <h2 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 44, lineHeight: 1.05, letterSpacing: '-0.02em', color: 'var(--fg-1)', margin: '12px auto 16px', maxWidth: 720 }}>
                  Stop duplicating containers.<br/>Start one shared pool.
                </h2>
                <p style={{ fontSize: 17, color: 'var(--fg-2)', maxWidth: 520, margin: '0 auto 28px' }}>
                  One curl. One binary. Every project gets the services it needs, isolated from every other project, on a stable port.
                </p>
                <div style={{ display: 'flex', gap: 12, justifyContent: 'center' }}>
                  <Button as="a" href="docs.html" arrow>Read the docs</Button>
                  <Button as="a" href="https://github.com/JCombee/dev.env" variant="secondary">Source on GitHub</Button>
                </div>
              </div>
            </section>
          </main>
          <Footer/>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
